<!DOCTYPE html>
<html>
<head>
    <title>Tra cứu Account</title>
</head>
<body>
    <h1>Tra cứu Account</h1>
    <form id="lookupForm">
        <input type="text" id="accountId" placeholder="Nhập ID">
        <button type="submit">Tìm</button>
    </form>
    <div id="accountInfo"></div>
    <a href="/home">Quay lại Home</a>

    <script>
    const form = document.getElementById("lookupForm");
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("accountId").value;
        const res = await fetch(`/api/account/${id}`);
        const data = await res.json();

        const container = document.getElementById("accountInfo");
        if (!data.Id) {
            container.innerHTML = "Không tìm thấy account";
        } else {
            container.innerHTML = `<p>ID: ${data.Id}</p>
                                   <p>Name: ${data.Name}</p>
                                   <p>Email: ${data.Email}</p>`;
        }
    });
    </script>
</body>
</html>
